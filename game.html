<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра | Последний полив</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .flower-area {
            background-image: url('images/background-game.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .flower-image {
            width: 80%;
            max-width: 280px;
            height: auto;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            transition: all 0.2s ease;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            filter: drop-shadow(5px 5px 0 var(--shadow-color));
            position: relative;
            z-index: 2;
        }
        
        .flower-image.glow {
            animation: pulse 0.6s infinite;
            filter: drop-shadow(0 0 15px gold) drop-shadow(5px 5px 0 var(--shadow-color));
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.08); opacity: 0.9; }
        }
        
        #flower-emoji {
            display: none;
        }
        
        .flower-image-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }
        
        #petals-count {
            background: var(--card-bg);
            padding: 8px 16px;
            margin-top: 10px;
            font-weight: bold;
            box-shadow: 5px 5px 0 var(--shadow-color);
            display: inline-block;
            position: relative;
            z-index: 2;
        }
        
        #combo-indicator {
            margin-top: 10px;
            font-weight: bold;
            color: var(--accent-color);
            text-shadow: 2px 2px 0 var(--shadow-color);
            position: relative;
            z-index: 2;
        }
        
        .hint-btn {
            margin-top: 15px;
            position: relative;
            z-index: 2;
        }
        
        .falling-petal {
            position: absolute;
            width: 80px;
            height: 80px;
            pointer-events: none;
            z-index: 10;
            animation: fallAndFade 2s ease-out forwards;
        }
        
        @keyframes fallAndFade {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(350px) rotate(200deg);
                opacity: 0;
            }
        }

        .word-description {
            background: var(--card-bg);
            padding: 12px 20px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.85rem;
            line-height: 1.6;
            box-shadow: 6px 6px 0 var(--shadow-color);
            font-family: 'VT323', 'Courier New', monospace;
            font-size: 1.1rem;
        }

        .word-description i {
            color: var(--accent-color);
        }

        .fact-btn {
            background: #66bb66;
            color: white;
            margin-top: 10px;
        }

        .fact-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 var(--shadow-color);
        }

        .fact-btn-hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="theme-switch-wrapper">
        <span>🌞</span>
        <label class="theme-switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider round"></span>
        </label>
        <span>🌙</span>
    </div>
    
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; padding: 8px 16px; background: var(--card-bg); clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);">
        <a href="index.html" class="nav-link">← В сад</a>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span>🎵</span>
            <label class="theme-switch" style="width: 40px;">
                <input type="checkbox" id="music-toggle">
                <span class="slider round"></span>
            </label>
            <span>🔇</span>
            <span>🔊</span>
            <input type="range" id="volume-slider" min="0" max="100" value="50" style="width: 100px;">
            <span id="volume-value">50%</span>
        </div>
        <a href="achievements.html" class="nav-link">🏆 Достижения</a>
    </div>
    
    <h2 style="text-align:center;">Поливай цветок знаниями</h2>
    
    <div id="word-description" class="word-description">
        <i>Загадано слово:</i> <span id="desc-placeholder">...</span>
    </div>
    
    <div class="game-layout">
        <div class="flower-area" id="flower-area">
            <div class="flower-image-container">
                <img id="flower-image" class="flower-image" src="images/rose.png" alt="Цветок">
            </div>
            <div id="petals-count">Лепестков: 5</div>
            <div id="combo-indicator" style="margin-top:10px;"></div>
            <button id="hint-button" class="hint-btn" style="margin-top: 12px;">Подсказка (3)</button>
        </div>
        <div>
            <div class="stats">
                <span>Счёт: <span id="score">100</span></span>
                <span>Ошибки: <span id="mistakes">0</span></span>
                <span>Комбо: <span id="combo">0</span></span>
            </div>
            <div class="word-mask" id="word-mask">_ _ _ _ _</div>
            <div class="keyboard" id="keyboard"></div>
            <div class="action-buttons">
                <button id="guess-word-btn">Угадать слово целиком</button>
                <button id="reset-game-btn">Новая игра</button>
            </div>
            <div style="text-align: center; margin-top: 15px;">
                <button id="fact-button" class="fact-btn fact-btn-hidden">📖 Посмотреть интересный факт</button>
            </div>
        </div>
    </div>
</div>

<script src="js/words.js"></script>
<script src="js/game.js"></script>

<script>
    (function() {
        const gameAudio = new Audio('audio/game.mp3');
        gameAudio.loop = true;
        
        const musicToggle = document.getElementById('music-toggle');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeValue = document.getElementById('volume-value');
        
        if (!musicToggle || !volumeSlider) {
            console.error('Элементы управления музыкой не найдены');
            return;
        }
        
        let isMusicPlaying = localStorage.getItem('game_music_playing') === 'true';
        let savedVolume = localStorage.getItem('game_music_volume');
        
        if (savedVolume !== null) {
            gameAudio.volume = savedVolume / 100;
            volumeSlider.value = savedVolume;
            volumeValue.textContent = savedVolume + '%';
        } else {
            gameAudio.volume = 0.5;
            volumeSlider.value = 50;
            volumeValue.textContent = '50%';
        }
        
        musicToggle.checked = isMusicPlaying;
        
        function startGameMusic() {
            gameAudio.play().then(() => {
                isMusicPlaying = true;
                localStorage.setItem('game_music_playing', 'true');
                console.log('Музыка запущена');
            }).catch(error => {
                console.log('Ошибка запуска музыки:', error);
                isMusicPlaying = false;
                musicToggle.checked = false;
                localStorage.setItem('game_music_playing', 'false');
            });
        }
        
        function stopGameMusic() {
            gameAudio.pause();
            isMusicPlaying = false;
            localStorage.setItem('game_music_playing', 'false');
            console.log('Музыка остановлена');
        }
        
        musicToggle.onclick = function(e) {
            console.log('Клик по кнопке музыки, новое состояние:', musicToggle.checked);
            if (musicToggle.checked) {
                startGameMusic();
            } else {
                stopGameMusic();
            }
        };
        
        volumeSlider.oninput = function(e) {
            const val = parseInt(e.target.value);
            gameAudio.volume = val / 100;
            volumeValue.textContent = val + '%';
            localStorage.setItem('game_music_volume', val);
            console.log('Громкость изменена:', val);
        };
        
        if (isMusicPlaying) {
            const playOnInteraction = function() {
                if (musicToggle.checked) {
                    gameAudio.play().catch(e => console.log('Автозапуск заблокирован'));
                }
                document.removeEventListener('click', playOnInteraction);
                document.removeEventListener('keydown', playOnInteraction);
            };
            document.addEventListener('click', playOnInteraction);
            document.addEventListener('keydown', playOnInteraction);
        }
        
        console.log('Музыкальный скрипт инициализирован, состояние:', isMusicPlaying);
    })();
    
    const themeToggle = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme') || 'light';
    if (currentTheme === 'dark') document.body.classList.add('dark');
    if (currentTheme === 'dark') themeToggle.checked = true;
    themeToggle.addEventListener('change', () => {
        if (themeToggle.checked) {
            document.body.classList.add('dark');
            localStorage.setItem('theme', 'dark');
        } else {
            document.body.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        }
    });
    
    function getCurrentPetalImage() {
        const settings = JSON.parse(localStorage.getItem('gameSettings'));
        if (settings) {
            switch(settings.difficulty) {
                case 'easy': return 'images/rose-petal.png';
                case 'normal': return 'images/chamomile-petal.png';
                case 'hard': return 'images/bell-petal.png';
                default: return 'images/chamomile-petal.png';
            }
        }
        return 'images/chamomile-petal.png';
    }
    
    function createFallingPetal() {
        const petalImg = getCurrentPetalImage();
        const petal = document.createElement('img');
        petal.src = petalImg;
        petal.className = 'falling-petal';
        
        const flowerArea = document.getElementById('flower-area');
        const flowerImage = document.getElementById('flower-image');
        
        if (flowerImage) {
            const rect = flowerImage.getBoundingClientRect();
            const flowerAreaRect = flowerArea.getBoundingClientRect();
            const randomX = (rect.left - flowerAreaRect.left) + (Math.random() * rect.width);
            const startY = (rect.top - flowerAreaRect.top) + 10;
            
            petal.style.left = randomX + 'px';
            petal.style.top = startY + 'px';
        } else {
            petal.style.left = Math.random() * (flowerArea.clientWidth - 30) + 'px';
            petal.style.top = '50px';
        }
        
        const randomRotation = Math.random() * 360;
        petal.style.transform = `rotate(${randomRotation}deg)`;
        
        flowerArea.appendChild(petal);
        
        setTimeout(() => {
            if (petal && petal.parentNode) {
                petal.remove();
            }
        }, 2000);
    }
    
    const originalHandleGuess = window.handleGuess;
    if (originalHandleGuess) {
        window.handleGuess = function(letter) {
            const oldMistakes = document.getElementById('mistakes') ? parseInt(document.getElementById('mistakes').textContent) : window.mistakes;
            
            originalHandleGuess(letter);
            
            const newMistakes = document.getElementById('mistakes') ? parseInt(document.getElementById('mistakes').textContent) : window.mistakes;
            
            if (newMistakes > oldMistakes && window.gameActive !== false) {
                setTimeout(() => {
                    createFallingPetal();
                }, 10);
            }
        };
    }
    
    const originalLoadSettings = window.loadSettings;
    const originalUpdateUI = window.updateUI;
    const originalInitGame = window.initGame;
    
    function updateFlowerImageByDifficulty() {
        const settings = JSON.parse(localStorage.getItem('gameSettings'));
        const flowerImage = document.getElementById('flower-image');
        if (!flowerImage) return;
        
        let imageName = 'images/rose.png';
        
        if (settings) {
            switch(settings.difficulty) {
                case 'easy':
                    imageName = 'images/rose.png';
                    break;
                case 'normal':
                    imageName = 'images/chamomile.png';
                    break;
                case 'hard':
                    imageName = 'images/bell.png';
                    break;
                default:
                    imageName = 'images/chamomile.png';
            }
        } else {
            imageName = 'images/chamomile.png';
        }
        
        flowerImage.src = imageName;
    }
    
    window.updateUI = function() {
        if (originalUpdateUI) {
            originalUpdateUI();
        }
        
        const flowerImage = document.getElementById('flower-image');
        const comboValue = parseInt(document.getElementById('combo')?.textContent || '0');
        
        if (flowerImage) {
            if (comboValue >= 2) {
                flowerImage.classList.add('glow');
            } else {
                flowerImage.classList.remove('glow');
            }
        }
    };
    
    window.loadSettings = function() {
        if (originalLoadSettings) {
            originalLoadSettings();
        }
        updateFlowerImageByDifficulty();
    };
    
    window.initGame = function() {
        if (originalInitGame) {
            originalInitGame();
        }
        updateFlowerImageByDifficulty();
        
        const flowerImage = document.getElementById('flower-image');
        if (flowerImage) {
            flowerImage.classList.remove('glow');
        }
        
        const existingPetals = document.querySelectorAll('.falling-petal');
        existingPetals.forEach(petal => petal.remove());
    };
    
    setTimeout(() => {
        updateFlowerImageByDifficulty();
        
        const checkComboInterval = setInterval(() => {
            const comboValue = parseInt(document.getElementById('combo')?.textContent || '0');
            const flowerImage = document.getElementById('flower-image');
            const comboIndicator = document.getElementById('combo-indicator');
            
            if (flowerImage) {
                if (comboValue >= 2) {
                    flowerImage.classList.add('glow');
                    if (comboIndicator) comboIndicator.innerHTML = "Цветок сияет!";
                } else {
                    flowerImage.classList.remove('glow');
                    if (comboIndicator && comboValue < 2) comboIndicator.innerHTML = "";
                }
            }
        }, 100);
        
        window.clearFlowerInterval = function() {
            clearInterval(checkComboInterval);
        };
    }, 50);
    
    const resetGameBtn = document.getElementById('reset-game-btn');
    if (resetGameBtn) {
        resetGameBtn.addEventListener('click', function() {
            setTimeout(() => {
                updateFlowerImageByDifficulty();
                const flowerImage = document.getElementById('flower-image');
                if (flowerImage) flowerImage.classList.remove('glow');
                
                const existingPetals = document.querySelectorAll('.falling-petal');
                existingPetals.forEach(petal => petal.remove());
            }, 10);
        });
    }
</script>
</body>
</html>
