<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Достижения | Садовод</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="theme-switch-wrapper">
        <span>🌞</span>
        <label class="theme-switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider round"></span>
        </label>
        <span>🌙</span>
    </div>
    
    <!-- Панель управления музыкой -->
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; padding: 8px 16px; background: var(--card-bg); clip-path: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);">
        <a href="index.html" class="nav-link">🏠 Главная</a>
        <div style="display: flex; align-items: center; gap: 10px;">
            <span>🎵</span>
            <label class="theme-switch" style="width: 40px;">
                <input type="checkbox" id="music-toggle">
                <span class="slider round"></span>
            </label>
            <span>🔇</span>
            <span>🔊</span>
            <input type="range" id="volume-slider" min="0" max="100" value="50" style="width: 100px;">
            <span id="volume-value">50%</span>
        </div>
        <a href="game.html" class="nav-link">🎮 Играть</a>
    </div>
    
    <h1 style="text-align:center;">🏆 Садовые трофеи 🏆</h1>
    <div id="achievements-list" class="achievements-grid"></div>
</div>

<script src="music.js"></script>
<script src="achievements.js"></script>

<script>
    // Инициализация музыки для achievements.html (achievements)
    const music = initPageMusic('achievements', 'achievements_music');
    console.log('Music initialized on achievements page');
    
    // Тёмная тема
    const toggle = document.getElementById('theme-toggle');
    const currentTheme = localStorage.getItem('theme') || 'light';
    if (currentTheme === 'dark') document.body.classList.add('dark');
    if (currentTheme === 'dark') toggle.checked = true;
    toggle.addEventListener('change', () => {
        if (toggle.checked) {
            document.body.classList.add('dark');
            localStorage.setItem('theme', 'dark');
        } else {
            document.body.classList.remove('dark');
            localStorage.setItem('theme', 'light');
        }
    });
</script>
</body>
</html>
