<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Достижения | Садовод</title>
    <script src="js/achievements.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="theme-switch-wrapper">
        <span>🌞</span>
        <label class="theme-switch">
            <input type="checkbox" id="theme-toggle">
            <span class="slider round"></span>
        </label>
        <span>🌙</span>
    </div>
    <div class="nav-bar">
        <div class="nav-links">
            <a href="index.html" class="nav-link">🏠 Главная</a>
            <div class="music-controls">
                <span>🎵</span>
                <label class="theme-switch" style="width: 40px;">
                    <input type="checkbox" id="music-toggle">
                    <span class="slider round"></span>
                </label>
                <span>🔇</span>
                <span>🔊</span>
                <input type="range" id="volume-slider" min="0" max="100" value="50" style="width: 100px;">
                <span id="volume-value">50%</span>
            </div>
            <a href="game.html" class="nav-link">🎮 Играть</a>
        </div>
    </div>
    <h1 style="text-align:center;">🏆 Садовые трофеи 🏆</h1>
    <div id="achievements-list" class="achievements-grid"></div>
</div>
</body>
</html>
